name: macOS (Apple Silicon)

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to attach the build to
        required: true
        default: v1.0.0

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Qt
        run: brew install qt
      - name: Build
        run: |
          cmake -S . -B build-release -DCMAKE_BUILD_TYPE=Release -DCMAKE_PREFIX_PATH="$(brew --prefix qt)"
          cmake --build build-release -j
      - name: Bundle
        run: |
          macdeployqt build-release/qtflap.app
          codesign --force --deep --sign - build-release/qtflap.app
          ditto -c -k --keepParent build-release/qtflap.app qtflap-macos-arm64.zip
      - name: Upload to release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ inputs.tag }}" qtflap-macos-arm64.zip --clobber
